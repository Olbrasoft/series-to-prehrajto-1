name: upload-manifest-tests
on:
  pull_request:
    paths:
      - "src/build_upload_manifest.py"
      - "src/download.py"
      - "src/sync_batch.py"
      - "src/pick_next_episode.py"
      - "src/source_download.py"
      - "src/download_policy.py"
      - "src/ops_status.py"
      - "src/prehrajto_upload.py"
      - "src/audit_language_sources.py"
      - "src/prepare_episode_sources.py"
      - "src/source_quality.py"
      - "tests/test_stream_size_probe.py"
      - "tests/test_download_resume.py"
      - "tests/test_source_download.py"
      - "tests/test_upload_original_format.py"
      - "tests/test_sync_complete_download.py"
      - "tests/test_download_policy_upgrade.py"
      - "tests/test_ops_status_stdlib.py"
      - "tests/test_build_upload_manifest.py"
      - "tests/test_source_discovery_recovery.py"
      - "tests/test_preparation_upload_failures.py"
      - "tests/test_prepare_episode_sources.py"
      - ".github/workflows/upload-manifest-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_download_resume.py tests/test_stream_size_probe.py tests/test_source_download.py tests/test_upload_original_format.py tests/test_sync_complete_download.py tests/test_download_policy_upgrade.py tests/test_ops_status_stdlib.py tests/test_build_upload_manifest.py tests/test_source_discovery_recovery.py tests/test_preparation_upload_failures.py tests/test_prepare_episode_sources.py tests/test_merge_preparation_results.py -q
